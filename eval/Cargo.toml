[package]
name = "zettyp-eval"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Persistent Typst evaluation and source provenance for ZetTypst"

# Core owns this end-to-end test; eval supplies its runtime and test harness.
[[test]]
name = "core-knowledge-local-to-observable"
path = "../core/knowledge/tests/local-to-observable/test.rs"

[[test]]
name = "core-policy-assembly-to-observable"
path = "../core/policy/tests/assembly-to-observable/test.rs"

[[test]]
name = "core-policy-evaluation-to-observable"
path = "../core/policy/tests/evaluation-to-observable/test.rs"

[[test]]
name = "core-policy-verified-observation"
path = "../core/policy/tests/verified-observation/test.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typst = "0.14.2"
typst-kit = { version = "0.14.2", default-features = false, features = [
  "embed-fonts",
  "packages",
] }
