name: Publish zettyp-eval to crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published GitHub Release version (for example, 0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-zettyp-eval-crates-io
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: crates-io
    steps:
      - name: Resolve published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import json

          version = os.environ["VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?", version):
              raise SystemExit("Expected a semantic version, not a tag or branch")
          tag = f"zettyp-eval-v{version}"
          release = json.loads(subprocess.check_output(
              ["gh", "release", "view", tag, "--json", "isDraft,tagName"], text=True,
          ))
          if release["isDraft"] or release["tagName"] != tag:
              raise SystemExit("An already published GitHub Release is required")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\n")
          PY
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false
      - name: Verify crate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          package = tomllib.loads(Path("eval/Cargo.toml").read_text())["package"]
          if package["name"] != "zettyp-eval" or package["version"] != os.environ["VERSION"]:
              raise SystemExit("Release tag and crate manifest do not match")
          PY
      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Test
        run: cargo +stable test -p zettyp-eval --locked
      - name: Publication preflight
        run: cargo +stable publish -p zettyp-eval --registry crates-io --locked --dry-run
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "Configure CARGO_REGISTRY_TOKEN in the crates-io environment."
            exit 1
          fi
          cargo +stable publish -p zettyp-eval --registry crates-io --locked
